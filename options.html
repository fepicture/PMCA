<!DOCTYPE html>
<html>

<head>
    <title>PMCA Options</title>
    <meta charset="utf-8">
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .form-group label {
            flex: 0 1 auto;
            font-family: 'Raleway', sans-serif;
            margin-right: 1rem;
        }

        .form-group .form-control,
        .form-group .form-check-input {
            flex: 1;
            max-width: 70%;
        }

        .form-check {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-check label {
            flex: 0 1 auto;
            font-family: 'Raleway', sans-serif;
            margin-right: 1rem;
        }

        .form-check input {
            flex: 0 1 auto;
        }
    </style>
</head>

<body style="width: 500px; height: 900px; background-color:bisque;">
    <div class="container-sm m-0">

        <!-- header -->
        <div style="display: flex;">
            <div class="my-3 mx-0 px-0 text-center" style="flex: 1;">
                <img src="assets/logo2.png" style="width: 100px;" />
            </div>
            <div class="mt-4 py-3" style="flex: 2;">
                <h2 id="message" style="font-family: 'Press Start 2P', cursive;">PMCA Options</h2>
            </div>
        </div>

        <!-- Options Form -->
        <div class="multifont my-0 py-0 by-0" style="text-align: center;">
            
            <form id="optionsForm">
                <div class="form-group">
                    <label for="problemSorterSelect" class="form-label">Sort Problems By</label>
                    <select class="form-select form-control" id="problemSorterSelect" name="problemSorterSelect">
                        <!-- options.js should add sorter options to this select -->
                    </select>
                </div>

                <button type="submit" class="btn btn-outline-warning custom-btn mt-5" style="font-family: 'Courier Prime', monospace;">Save</button>
            </form>

            <div id="feedbackMessage" class="alert alert-success mt-3" style="display: none; text-align: center;" role="alert">
                Options are successfully saved!
            </div>

            <!-- Data management -->
            <hr class="mt-5 mb-4" />
            <h5 class="mb-3" style="font-family: 'Press Start 2P', cursive; font-size: 0.8rem;">Data</h5>

            <div class="d-flex flex-column gap-2 align-items-stretch">
                <button type="button" id="exportCsvBtn" class="btn btn-outline-warning custom-btn"
                    style="font-family: 'Courier Prime', monospace;">Export records to CSV</button>

                <input type="file" id="importCsvInput" accept=".csv,text/csv" style="display: none;" />
                <button type="button" id="importCsvBtn" class="btn btn-outline-warning custom-btn"
                    style="font-family: 'Courier Prime', monospace;">Import records from CSV</button>

                <button type="button" id="clearAllBtn" class="btn btn-outline-danger"
                    data-bs-toggle="modal" data-bs-target="#clearConfirmModal"
                    style="font-family: 'Courier Prime', monospace;">Clear all records</button>
            </div>

            <div id="dataFeedback" class="alert mt-3" style="display: none; text-align: center;" role="alert"></div>
        </div>

        <!-- footer -->
        <div class="text-center mb-3 mt-3"
            style="display: flex; align-items: center; justify-content: center; text-align: center; position:fixed; bottom: 0;">
            <a class="mb-0" href="https://github.com/HaolinZhong/PMCA/issues/new" target="_blank">
                <button type="button" class="btn btn-outline-warning custom-btn"
                    style="font-size: smaller; font-family: 'Courier Prime', monospace;">Request new features / Report a
                    bug</button>
            </a>
        </div>

        <!-- Clear-all confirmation -->
        <div class="modal fade" id="clearConfirmModal" tabindex="-1" aria-labelledby="clearConfirmLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="background-color: bisque;">
                    <div class="modal-header">
                        <h5 class="modal-title" id="clearConfirmLabel"
                            style="font-family: 'Courier Prime', monospace;">Clear all records?</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body multifont" style="text-align: left;">
                        This permanently deletes <b>all</b> tracked problems on <b>both</b> LeetCode Global and CN, and
                        clears the undo history. This cannot be undone &mdash; consider exporting a CSV backup first.
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                            style="font-family: 'Courier Prime', monospace;">Cancel</button>
                        <button type="button" id="confirmClearBtn" class="btn btn-danger" data-bs-dismiss="modal"
                            style="font-family: 'Courier Prime', monospace;">Yes, clear everything</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="dist/options.js"></script>
    <script type="text/javascript" src="lib/bootstrap.bundle.min.js"></script>
</body>

</html>
